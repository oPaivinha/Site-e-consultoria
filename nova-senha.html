<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Nova senha | Paiva Nutri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="form-page" data-page="nova-senha">

  <header class="topbar">
    <div class="container topbar__inner">
      <a href="index.html" class="brand" data-brand>Paiva Nutri</a>
      <span class="topbar__aside"><a href="index.html">Voltar ao site</a></span>
    </div>
  </header>

  <main class="form-wrap auth-card">
    <div class="form-card">
      <p class="msg msg--aviso" id="demoMsg" hidden>Não foi possível conectar ao servidor agora. Tente novamente mais tarde.</p>
      <h1 class="page-title">Crie sua senha</h1>
      <p class="msg" id="msg" role="alert" hidden></p>

      <form id="novaForm" novalidate hidden>
        <p class="muted">Conta: <strong id="contaEmail"></strong></p>
        <input type="email" name="username" autocomplete="username" hidden>
        <div class="field">
          <label for="senha">Nova senha <span class="hint">mínimo de 8 caracteres</span></label>
          <input type="password" id="senha" name="senha" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field">
          <label for="senha2">Repita a nova senha</label>
          <input type="password" id="senha2" name="senha2" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn--block" id="btnSalvar">Salvar senha</button>
      </form>

      <div class="auth-links" id="pedirOutro" hidden>
        <a href="esqueci-senha.html">Pedir um novo link</a>
        <a href="entrar.html">Entrar</a>
      </div>
    </div>
  </main>


  <footer class="footer footer--compact">
    <div class="container footer__inner">
      <p class="muted"><strong data-brand>Paiva Nutri</strong> · <span data-crn>Nutricionista</span></p>
      <div class="footer__links">
        <a href="index.html">Início</a>
        <a href="privacidade.html">Política de privacidade</a>
      </div>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="auth.js"></script>
  <script src="site.js"></script>
  <script src="contas.js"></script>
</body>
</html>
