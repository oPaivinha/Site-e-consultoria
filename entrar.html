<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Entrar | Paiva Nutri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="form-page" data-page="entrar">

  <header class="topbar">
    <div class="container topbar__inner">
      <a href="index.html" class="brand" data-brand>Paiva Nutri</a>
      <a href="index.html" class="muted" style="font-size:.92rem;text-decoration:none">← Voltar ao site</a>
    </div>
  </header>

  <main class="form-wrap auth-card">
    <div class="form-card">
      <p class="msg msg--erro" id="demoMsg" hidden>Modo demonstração: o Supabase ainda não foi configurado em config.js. Nada é salvo.</p>
      <h1 style="font-size:1.8rem">Entrar</h1>
      <p class="muted">Acesse sua anamnese, seus check-ins e seus dados.</p>
      <p class="msg" id="msg" role="alert" hidden></p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn--block" id="btnEntrar">Entrar</button>
        <button type="button" class="btn btn--ghost btn--block" id="btnReenviar" style="margin-top:12px" hidden>Reenviar e-mail de confirmação</button>
      </form>

      <div class="auth-links">
        <a href="esqueci-senha.html">Esqueci minha senha</a>
        <span class="muted">Ainda não tem conta? <a href="formulario.html">Preencha o pré-formulário</a>: a conta é criada no fim dele.</span>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="auth.js"></script>
  <script src="site.js"></script>
  <script src="contas.js"></script>
</body>
</html>
